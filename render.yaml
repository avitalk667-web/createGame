# Render Blueprint for PORTAL X (free plan, no credit card).
# The database is an external free Neon PostgreSQL; its URL is entered in the Render dashboard
# as the secret DATABASE_URL (sync: false = never stored in this repository).
services:
  - type: web
    name: portal-x
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Email through Gmail API over HTTPS with OAuth (see docs/email-setup.md). No SMTP: Render Free blocks SMTP ports.
      # Secret values are entered in the Render dashboard only; they never go into Git.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://portal-x-scfm.onrender.com/api/admin/email/google/callback
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PORTALX_CONTACT_EMAIL
        value: info.portalx@gmail.com
      - key: PORTALX_SITE_URL
        value: https://portal-x-scfm.onrender.com
      - key: PORTALX_COMMUNITY_GROUP_URL
        sync: false
      - key: PORTALX_UNSUBSCRIBE_SECRET
        sync: false
